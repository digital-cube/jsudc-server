name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jsudc
          POSTGRES_PASSWORD: jsudc
          POSTGRES_DB: jsudc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jsudc -d jsudc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create the UDC objects and their fixture tables in it (test/global-setup.ts).
      TEST_DATABASE_URL: postgresql://jsudc:jsudc@localhost:5432/jsudc_test
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm`: setup-node refuses it without a lockfile, and there is none yet.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # @jsudc/core comes from the private digital-cube/jsudc-core at its v0.1.0 tag until it
      # is on npmjs.org. JSUDC_CORE_DEPLOY_KEY is the private half of a read-only deploy key
      # of that repository.
      - name: Read access to digital-cube/jsudc-core
        env:
          DEPLOY_KEY: ${{ secrets.JSUDC_CORE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      # `npm install` also runs `prepare`, which builds dist. No lockfile yet: @jsudc/core is
      # a git dependency until the first npm release; commit one then and use `npm ci`.
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build
