name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: check (postgres ${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SQL compiler compares and sorts text by code point (COLLATE "C"), as the
        # in-memory evaluator does, whatever the database's collation: the image's
        # default en_US.utf8 (linguistic) is what catches a comparison without it;
        # C.UTF-8 is the collation of development. (Not plain C: its lower() and
        # ILIKE fold ASCII only, so case-insensitive matches of "Č" would differ.)
        include:
          - locale: en_US.utf8
            initdb_args: ""
          - locale: C.UTF-8
            initdb_args: --locale=C.UTF-8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jsudc
          POSTGRES_PASSWORD: jsudc
          POSTGRES_DB: jsudc_test
          POSTGRES_INITDB_ARGS: ${{ matrix.initdb_args }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jsudc -d jsudc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create the UDC objects and their fixture tables in it (test/global-setup.ts).
      TEST_DATABASE_URL: postgresql://jsudc:jsudc@localhost:5432/jsudc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` also runs `prepare`, which builds dist.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build
